schema: bevy-editor-uat/v1
id: UAT-TILE-001
version: 1
title: "AutoLayer deterministic rule workflow"
persona: technical-designer
priority: P1
release_gate: v1
modes:
  - manual-guided
  - playwright
  - hybrid
goal: "Paint terrain using rules and get reproducible output."
fixture:
