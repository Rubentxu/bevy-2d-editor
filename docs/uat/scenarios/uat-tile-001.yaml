preconditions:
  - "Use an isolated copy of the fixture project."
steps:
  - id: step-1
    instruction: "Open tile fixture."
    action:
      kind: manual-or-adapter
      value: "Open tile fixture."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-2
    instruction: "Create/apply terrain rule preset."
    action:
      kind: manual-or-adapter
      value: "Create/apply terrain rule preset."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-3
    instruction: "Inspect advanced Rule Graph."
    action:
      kind: manual-or-adapter
      value: "Inspect advanced Rule Graph."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-4
    instruction: "Paint with fixed seed."
    action:
      kind: manual-or-adapter
      value: "Paint with fixed seed."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-5
    instruction: "Undo and repaint same seed."
    action:
      kind: manual-or-adapter
      value: "Undo and repaint same seed."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-6
    instruction: "Save/reload."
    action:
      kind: manual-or-adapter
      value: "Save/reload."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
final:
  semantic:
    - "rule graph valid"
