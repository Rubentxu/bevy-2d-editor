    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-4
    instruction: "Verify both semantic effects reverted."
    action:
      kind: manual-or-adapter
      value: "Verify both semantic effects reverted."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-5
    instruction: "Redo and verify both reapplied."
