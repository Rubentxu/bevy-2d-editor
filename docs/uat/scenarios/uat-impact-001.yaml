schema: bevy-editor-uat/v1
id: UAT-IMPACT-001
version: 1
title: "Delete asset with impact analysis"
persona: technical-designer
priority: P1
release_gate: v1
modes:
  - manual-guided
  - playwright
  - hybrid
goal: "Prevent blind destructive asset changes."
fixture:
  project: fixtures/impact_001
preconditions:
  - "Use an isolated copy of the fixture project."
steps:
  - id: step-1
    instruction: "Open dependency fixture."
    action:
      kind: manual-or-adapter
      value: "Open dependency fixture."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-2
    instruction: "Select a texture used by multiple Scene Assets."
    action:
      kind: manual-or-adapter
      value: "Select a texture used by multiple Scene Assets."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-3
    instruction: "Request delete and inspect Impact Lens."
    action:
      kind: manual-or-adapter
      value: "Request delete and inspect Impact Lens."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-4
    instruction: "Cancel."
    action:
      kind: manual-or-adapter
      value: "Cancel."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-5
    instruction: "Repair one dependency and repeat approved delete."
    action:
      kind: manual-or-adapter
      value: "Repair one dependency and repeat approved delete."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
final:
  graph:
    - "impact lists direct/transitive dependents"
  semantic:
    - "cancel performs no mutation"
    - "approved delete leaves no dangling references"
evidence:
  level: E2
  capture:
    - screenshot-on-failure
    - changesets
    - validation
    - semantic-summary
