      kind: manual-or-adapter
      value: "Ask for a multi-resource gameplay change."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-3
    instruction: "Inspect proposal in Changes."
    action:
      kind: manual-or-adapter
      value: "Inspect proposal in Changes."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-4
    instruction: "Approve only allowed subset."
    action:
      kind: manual-or-adapter
      value: "Approve only allowed subset."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
  - id: step-5
    instruction: "Verify post-apply validation."
    action:
      kind: manual-or-adapter
      value: "Verify post-apply validation."
    expect:
      checkpoint: "No unexpected critical error; validate relevant final assertions."
final:
  semantic:
