[package]
name = "editor-application"
version = "0.1.0"
edition = "2024"
description = "Editor application services: ports and adapters for the application layer. No Bevy, no WASM, no JS at the crate root."
repository = "https://github.com/Rubentxu/bevy-2d-editor"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
editor-model = { path = "../editor-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
editor-core = { path = "../editor-core", features = ["dispatch-via-kernel"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
