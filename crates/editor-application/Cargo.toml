[package]
name = "editor-application"
version = "0.1.0"
edition = "2024"
description = "Editor application services: ports and adapters for the application layer. No Bevy, no WASM, no JS at the crate root."
repository = "https://github.com/Rubentxu/bevy-2d-editor"
license = "MIT OR Apache-2.0"

[lib]

[dependencies]
editor-model = { path = "../editor-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
