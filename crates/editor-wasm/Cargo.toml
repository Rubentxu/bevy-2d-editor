[package]
name = "editor-wasm"
version = "0.1.0"
edition = "2024"

[lib]
name = "editor_application"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
editor-model = { path = "../editor-model" }
editor-protocol = { path = "../editor-protocol" }
editor-application = { path = "../editor-application" }
editor-bevy = { path = "../editor-bevy" }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["v4", "js"] }
