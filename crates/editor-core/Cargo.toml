[package]
name = "editor-core"
version = "0.1.0"
edition = "2024"
description = "Bevy 2D editor core (WASM-compiled) — scene authoring, asset pipelines, logic graphs"
repository = "https://github.com/Rubentxu/bevy-2d-editor"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["2d"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
editor-model = { path = "../editor-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "1"
rand = { version = "0.9", default-features = false, features = ["std_rng"] }

[features]
default = ["dispatch-via-kernel"]
dispatch-via-kernel = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
js-sys = { version = "0.3" }
