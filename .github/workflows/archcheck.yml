name: Architecture Fitness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  archcheck:
    name: archcheck assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'tools/archcheck/node_modules'

      - name: Install dependencies
        working-directory: tools/archcheck
        run: npm ci

      - name: Run archcheck
        working-directory: tools/archcheck
        run: npm run check
