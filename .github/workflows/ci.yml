name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  lint-rust:
    runs-on: ubuntu-latest
    continue-on-error: true # Existing workspace warnings are tracked as non-blocking noise.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Run release Rust tests
        run: cargo test --workspace --all-targets --release --locked
      - name: Write test result summary
        if: always()
        run: |
          mkdir -p test-results
          printf 'Rust tests completed with status: %s\n' '${{ job.status }}' > test-results/rust-tests.txt
      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: test-results/

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:wasm
      - run: npx playwright test --workers=1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: npm ci
      - run: npm run build
      - name: Verify frontend output
        run: test -d dist && test -f dist/index.html
      - name: Enforce 350 KB gzip JavaScript budget
        run: node scripts/check-bundle-size.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  a11y-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:wasm
      - run: npx playwright test tests/ux-a11y.spec.ts --workers=1
