name: Baseline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev pkg-config libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --all-targets --release --locked

      - name: Check WASM target
        run: cargo check -p editor-core --target wasm32-unknown-unknown --locked

      - name: Doc warnings gate (editor-model, editor-application)
        run: cargo doc --no-deps -D warnings -p editor-model -p editor-application

  frontend-lint:
    name: Frontend static gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM types
        run: npm run build:wasm

      - name: Format WASM glue files
        run: npx prettier --write src/wasm/*.d.ts

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run typecheck
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend build and bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build and check bundle budget (ADR-0029)
        run: npm run build:check

  docs-check:
    name: Documentation drift check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs-check tool
        working-directory: tools/docs-check
        run: npm ci

      - name: Install docs-check dependencies
        run: npm install --prefix tools/docs-check

      - name: Run docs-check
        working-directory: tools/docs-check
        run: npm run check

  editor-model-purity:
    name: editor-model purity (no Bevy/WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify editor-model builds for native
        run: cargo build -p editor-model --locked

      - name: Verify editor-model builds for wasm32 (proves no Bevy/WASM deps)
        run: cargo build -p editor-model --target wasm32-unknown-unknown --locked

      - name: Verify editor-model has NO bevy or wasm deps (grep gate)
        run: |
          if grep -E '^bevy\s*=|^wasm-bindgen\s*=|^web-sys\s*=|^js-sys\s*=' crates/editor-model/Cargo.toml; then
            echo "ERROR: editor-model must not depend on bevy or wasm crates"
            exit 1
          fi

      - name: Test editor-model
        run: cargo test -p editor-model --locked
