name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: npm ci
      - name: Build release WASM
        run: wasm-pack build ../crates/editor-core --target web --release --out-dir ../../frontend/src/wasm
      - name: Build frontend
        run: npx tsc && npx vite build
      - name: Enforce bundle budget
        run: node scripts/check-bundle-size.mjs
      - name: Package frontend
        run: tar -czf bevy-2d-editor-${{ github.ref_name }}.tar.gz -C dist .
      - name: Upload GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: frontend/bevy-2d-editor-${{ github.ref_name }}.tar.gz
